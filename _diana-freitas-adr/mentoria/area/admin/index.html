<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel · Mentoria Sublime</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2B0A11">
<link rel="icon" href="../../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../area.css">
<style>
body{background:var(--sand)}
.shell{display:grid;grid-template-columns:290px 1fr;min-height:100svh}
.side{position:sticky;top:0;height:100svh;overflow:auto;display:flex;flex-direction:column;padding:24px 16px 20px}
.side .logo{width:92px;margin:0 8px 6px}
.side .eyebrow{color:var(--goldl);font-size:10.5px;margin:0 8px 22px}
.side h4{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#BFA698;font-weight:500;margin:20px 10px 8px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:0;background:none;cursor:pointer;color:#F2E4D6;font-size:14px;transition:background .2s}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button.on{background:rgba(226,192,142,.14);color:#fff}
.nav .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:500;background:rgba(226,192,142,.16);color:var(--goldl)}
.nav .nm{flex:1;min-width:0;line-height:1.3}
.nav .nm small{display:block;font-size:11.5px;color:#BFA698}
.nav .nm b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .dot{min-width:20px;height:20px;border-radius:10px;background:var(--goldg);color:var(--wine);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.nav svg{width:18px;height:18px;color:var(--goldl);flex:none}
.side .new{margin:8px 0 0;width:100%}
.side .out{margin-top:auto;padding-top:20px;display:flex;gap:14px;justify-content:center;font-size:12.5px}
.side .out a,.side .out button{background:none;border:0;cursor:pointer;color:#BFA698;text-decoration:none}
.side .out a:hover,.side .out button:hover{color:var(--goldl)}

.main{padding:clamp(20px,3.4vw,40px);min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,2.6vw,28px)}
.head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.head .av{width:58px;height:58px;border-radius:50%;background:var(--wine3);color:var(--goldl);display:grid;place-items:center;font-size:20px;font-weight:500;flex:none}
.head h1{font-weight:500;font-size:clamp(21px,2.6vw,26px);letter-spacing:-.01em;line-height:1.2}
.head p{font-size:13.5px;color:var(--muted)}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.st{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#E9F2E4;color:#3C6A2A;margin-left:6px;vertical-align:middle}
.st.pausada{background:#F5E6E6;color:#8A3340}.st.concluida{background:var(--sand);color:var(--goldd)}
.tabs{display:flex;gap:4px;margin:22px 0 18px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;cursor:pointer;padding:12px 16px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--wine3);border-color:var(--gold);font-weight:500}
.tabs .dot{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--wine3);color:#fff;font-size:10.5px;margin-left:6px;padding:0 5px}
.grid{display:grid;gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1.2fr .8fr .6fr;gap:14px}
.medit{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,34px)}
.medit h3{display:flex;align-items:center;gap:12px;font-weight:500;font-size:17px}
.medit h3 .k{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:13px;color:var(--wine3);flex:none}
.medit h3 .k.b{background:var(--goldg);border:0;color:var(--wine)}
.fields{display:grid;gap:12px;align-content:start}
.ck{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--wine3)}
.save{display:flex;align-items:center;gap:12px}
.save small{font-size:12.5px;color:var(--soft)}
.mlist{display:grid;gap:8px}
.mi{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:9px 10px;border-radius:14px;background:var(--ivory);border:1px solid var(--line)}
.mi .ic{width:38px;height:38px;border-radius:12px;background:var(--paper);display:grid;place-items:center;color:var(--wine3);box-shadow:inset 0 0 0 1px var(--line)}
.mi .ic svg{width:18px;height:18px}
.mi b{display:block;font-size:14px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.mi small{font-size:11.5px;color:var(--soft)}
.mi .tag{font-size:10.5px;background:var(--sand);color:var(--goldd);border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:500}
.mi .bt{display:flex;gap:2px}
.mi .bt button{width:32px;height:32px;border:0;border-radius:50%;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.mi .bt button:hover{background:var(--sand);color:var(--wine3)}
.mi .bt svg{width:16px;height:16px}
.up{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.drop{display:block;margin-top:10px;border:1.5px dashed rgba(184,137,79,.5);border-radius:16px;padding:16px;text-align:center;font-size:13.5px;color:var(--muted);transition:background .2s,border-color .2s;cursor:pointer}
.drop.over{background:#FBF3E8;border-color:var(--gold)}
.drop b{color:var(--wine3)}
.mh{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:500;margin-bottom:10px}
.empty{font-size:13.5px;color:var(--soft);padding:14px;border:1px dashed rgba(43,10,17,.14);border-radius:14px;text-align:center}
.prog{height:4px;border-radius:4px;background:var(--sand);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--goldg);transition:width .2s}
.feed{display:grid;gap:10px;margin-bottom:16px}
.n{max-width:88%;padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:1.55}
.n small{display:block;font-size:11.5px;color:var(--soft);margin-top:4px}
.n.aluna{justify-self:start;background:var(--ivory);border:1px solid var(--line);border-bottom-left-radius:6px}
.n.diana{justify-self:end;background:var(--wine3);color:#F7EEE4;border-bottom-right-radius:6px}
.n.diana small{color:#D9BFAF}
.n.novo{box-shadow:0 0 0 2px var(--goldl)}
.brief-t{min-height:340px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.kpi b{display:block;font-size:26px;font-weight:500;line-height:1.1;color:var(--wine3)}
.kpi span{font-size:12.5px;color:var(--muted)}
.list{display:grid;gap:10px}
.row-a{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--paper);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;transition:border-color .2s}
.row-a:hover{border-color:rgba(184,137,79,.5)}
.row-a .av{width:44px;height:44px;border-radius:50%;background:var(--wine3);color:var(--goldl);display:grid;place-items:center;font-weight:500}
.row-a b{display:block;font-weight:500;font-size:15px}
.row-a small{font-size:12.5px;color:var(--muted)}
.row-a .nx{font-size:12.5px;color:var(--wine3);text-align:right}
h2.t{font-weight:500;font-size:clamp(21px,2.6vw,26px);letter-spacing:-.01em;margin-bottom:6px}
p.s{font-size:14px;color:var(--muted);margin-bottom:20px}

dialog{border:0;border-radius:26px;padding:0;width:min(520px,calc(100% - 28px));background:var(--paper);color:var(--ink);box-shadow:0 40px 80px rgba(0,0,0,.35);margin:auto}
dialog::backdrop{background:rgba(31,7,12,.6);backdrop-filter:blur(3px)}
.dlg{padding:26px clamp(20px,4vw,30px);display:grid;gap:14px}
.dlg h3{font-weight:500;font-size:20px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:6px}
.pwrow{display:flex;gap:8px}
.pwrow input{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.acesso{white-space:pre-wrap;background:var(--ivory);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.55;border:1px solid var(--line)}
.mob{display:none}
.danger{color:#9B2C3B!important;box-shadow:inset 0 0 0 1px rgba(155,44,59,.35)!important;background:none!important}

.semlogin{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px;background:linear-gradient(120deg,#F6EDE2,#FBF5EE);border-color:rgba(184,137,79,.35)}
.semlogin p{font-size:13.5px;color:var(--muted)}
.metas{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.meta-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.meta .big{display:block;font-size:clamp(26px,3vw,32px);font-weight:500;letter-spacing:-.02em;color:var(--wine3);line-height:1.15;margin-top:2px}
.meta-h small{font-size:13px;color:var(--muted)}
.pct{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:500;color:var(--wine3);box-shadow:inset 0 0 0 1px rgba(184,137,79,.5)}
.pct.ok{background:var(--goldg);color:var(--wine);box-shadow:none}.pct svg{width:22px;height:22px}
.trk{position:relative;height:8px;border-radius:8px;background:var(--sand);margin:34px 8px 34px}
.trk>i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--goldg);transition:width .6s}
.ms{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.ms em{width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px rgba(184,137,79,.5);display:grid;place-items:center;color:var(--wine)}
.ms.ok em{background:var(--wine3);box-shadow:0 0 0 3px rgba(226,192,142,.5);color:var(--goldl)}
.ms em svg{width:12px;height:12px}
.ms small{position:absolute;top:28px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;color:var(--soft)}
.ms.ok small{color:var(--wine3);font-weight:500}
.ms:last-of-type small{left:auto;right:-6px;transform:none}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:20px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-style:normal;font-size:9.5px;color:var(--soft);font-weight:500}
.dots i.on{background:var(--goldg);color:var(--wine);box-shadow:0 3px 8px rgba(184,137,79,.3)}
.dots i.dez{box-shadow:inset 0 0 0 1.5px rgba(106,29,46,.35)}
.dots i.on.dez{background:var(--wine3);color:var(--goldl);box-shadow:none}
.rel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rel-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rel-f select{width:auto;padding:9px 14px;font-size:13.5px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
td small{display:block;font-size:12px;color:var(--soft)}
td.v{font-weight:500;white-space:nowrap}
tr.off td{opacity:.55}
tfoot td{font-weight:500;border:0;padding-top:16px}
@media (max-width:980px){.medit,.g3,.metas{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .3s;box-shadow:20px 0 40px rgba(0,0,0,.3)}
  .side.on{transform:none}
  .mob{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:0;z-index:30}
  .mob img{width:80px}
  .mob button{border:0;background:none;color:var(--goldl);cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13.5px}
  .mob svg{width:22px;height:22px}
  .g2{grid-template-columns:1fr}
  .head .acts{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div id="carregando" class="wine loading"><i></i></div>
<div id="login" class="wine" data-base="../../" hidden></div>
<div id="estado" class="wine" hidden></div>
<div id="app" hidden>
  <div class="mob wine"><img src="../../logo-sublime.png" alt="Mentoria Sublime" width="754" height="247"><button id="menu" aria-label="Abrir menu"><span>Alunas</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
  <div class="shell">
    <aside class="side wine" id="side"></aside>
    <main class="main" id="main"></main>
  </div>
</div>
<dialog id="dlg"><div class="dlg" id="dlg-in"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../comum.js"></script>
<script>
const I = {
  plus: '<path d="M12 5v14M5 12h14"/>', up: '<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>', link: ICONES.link,
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.7c1.8.7 3 2.4 3.5 5.3"/>',
  box: '<path d="M3 7.5l9-4.5 9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>',
  inbox: '<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/>',
  wa: '<path d="M4.5 19.5l1.2-3.6A8 8 0 1 1 8.4 18.6z"/>',
  money: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  dl: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'
};
let A = { alunas: [], unread: {}, briefings: [], vista: "inicio", aluna: null, tab: "encontros", mods: [], mats: [], notas: [] };

function mostrar(id) { ["carregando", "login", "estado", "app"].forEach(x => $("#" + x).hidden = x !== id); }
const ini = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase();

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { montarLogin({ titulo: 'Painel da<br><em>Mentoria Sublime.</em>', sub: "Acesso da Diana", aoEntrar: iniciar }); mostrar("login"); return; }
  if (!(await souAdmin())) {
    $("#estado").innerHTML = `<div class="state" style="min-height:100svh;display:grid;place-items:center;text-align:center;padding:30px"><div><h1 style="font-weight:400;font-size:26px">Este painel é só da Diana.</h1><p style="color:#DCC6B6;margin:10px 0 22px">Você entrou com um login de aluna.</p><a class="btn btn-gold" href="../">Ir para a minha área</a> <button class="btn btn-ghost" onclick="sair()">Sair</button></div></div>`;
    mostrar("estado"); return;
  }
  await carregarLista();
  const q = new URLSearchParams(location.search).get("aluna");
  mostrar("app");
  if (q && A.alunas.some(a => a.id === q)) abrirAluna(q); else abrirInicio();
}

async function carregarLista() {
  const [al, nt, br] = await Promise.all([
    sb.from("ms_alunas").select("*").order("criado_em", { ascending: false }),
    sb.from("ms_notas").select("aluna_id").eq("autor", "aluna").eq("lida", false),
    sb.from("ms_briefings").select("*").is("aluna_id", null).order("criado_em", { ascending: false })
  ]);
  A.alunas = al.data || []; A.briefings = br.data || []; A.unread = {};
  (nt.data || []).forEach(n => A.unread[n.aluna_id] = (A.unread[n.aluna_id] || 0) + 1);
  renderSide();
}

function renderSide() {
  $("#side").innerHTML = `
    <img class="logo" src="../../logo-sublime.png" alt="Mentoria Sublime" width="754" height="247">
    <span class="eyebrow">Painel da Diana</span>
    <div class="nav">
      <button data-v="inicio" class="${A.vista === "inicio" ? "on" : ""}">${svg(I.users)}<span class="nm"><b>Todas as alunas</b></span></button>
      <button data-v="gerais" class="${A.vista === "gerais" ? "on" : ""}">${svg(I.box)}<span class="nm"><b>Materiais para todas</b></span></button>
      <button data-v="financeiro" class="${A.vista === "financeiro" ? "on" : ""}">${svg(I.money)}<span class="nm"><b>Financeiro e metas</b></span></button>
      <button data-v="briefings" class="${A.vista === "briefings" ? "on" : ""}">${svg(I.inbox)}<span class="nm"><b>Briefings recebidos</b></span>${A.briefings.length ? `<span class="dot">${A.briefings.length}</span>` : ""}</button>
    </div>
    <h4>Alunas</h4>
    <div class="nav">${A.alunas.map(a => `<button data-a="${a.id}" class="${A.vista === "aluna" && A.aluna?.id === a.id ? "on" : ""}"><span class="av">${ini(a.nome)}</span><span class="nm"><b>${esc(a.nome)}</b><small>${!a.user_id ? "sem login ainda" : a.status === "ativa" ? esc(a.instagram || a.email) : a.status}</small></span>${A.unread[a.id] ? `<span class="dot">${A.unread[a.id]}</span>` : !a.user_id ? `<span class="dot">!</span>` : ""}</button>`).join("") || `<p style="font-size:13px;color:#BFA698;padding:4px 10px">Nenhuma aluna ainda.</p>`}</div>
    <button class="btn btn-gold btn-sm new" id="nova">${svg(I.plus)}Nova aluna</button>
    <div class="out"><a href="../">Ver área da aluna</a><button onclick="sair()">Sair</button></div>`;
  $$("#side [data-v]").forEach(b => b.onclick = () => { fecharMenu(); ({ inicio: abrirInicio, gerais: abrirGerais, briefings: abrirBriefings, financeiro: abrirFinanceiro })[b.dataset.v](); });
  $$("#side [data-a]").forEach(b => b.onclick = () => { fecharMenu(); abrirAluna(b.dataset.a); });
  $("#nova").onclick = () => { fecharMenu(); dlgNova(); };
}
function fecharMenu() { $("#side").classList.remove("on"); }
$("#menu").onclick = () => $("#side").classList.toggle("on");
function setURL(id) { history.replaceState(null, "", id ? "?aluna=" + id : location.pathname); }

/* ---------- início ---------- */
async function abrirInicio() {
  A.vista = "inicio"; A.aluna = null; setURL(); renderSide();
  const { data: mods } = await sb.from("ms_modulos").select("aluna_id,ordem,titulo,data,hora,concluido,tipo").eq("tipo", "encontro").order("data");
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const prox = {}; (mods || []).forEach(m => { if (!m.concluido && m.data && parseDate(m.data) >= hoje && !prox[m.aluna_id]) prox[m.aluna_id] = m; });
  const semana = (mods || []).filter(m => !m.concluido && m.data && (parseDate(m.data) - hoje) / 864e5 <= 7 && parseDate(m.data) >= hoje).length;
  const ativas = A.alunas.filter(a => a.status === "ativa").length, nl = Object.values(A.unread).reduce((s, n) => s + n, 0);
  $("#main").innerHTML = `
    <h2 class="t">Olá, Diana.</h2><p class="s">Aqui você cria os acessos, marca as datas dos encontros e sobe os materiais de cada aluna.</p>

function ligarMats(root, alunaId, recarregar) {
  const lista = () => alunaId ? A.mats : A.gerais;

    if (x.caminho) await sb.storage.from("mentoria").remove([x.caminho]);
    const { error } = await sb.from("ms_materiais").delete().eq("id", x.id);
    if (error) return toast("Não consegui excluir.");
    toast("Material excluído."); recarregar();
  });
  $$("[data-ren]", root).forEach(b => b.onclick = async () => {

  $$("[data-file]", root).forEach(inp => inp.onchange = () => enviar([...inp.files], inp.dataset.file, alunaId, inp.closest(".drop"), recarregar));
  $$("[data-drop]", root).forEach(d => {
    d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };

    d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); enviar([...e.dataTransfer.files], d.dataset.drop, alunaId, d, recarregar); };
  });
}

const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.-]+/g, "-").replace(/-+/g, "-").slice(-80);
async function enviar(files, sec, alunaId, drop, recarregar) {
  if (!files.length) return;
  const pg = $(".prog", drop), bar = $(".prog i", drop); pg.hidden = false;
  let ok = 0;
  for (const [i, f] of files.entries()) {
    bar.style.width = Math.round(i / files.length * 100 + 10) + "%";
    if (f.size > 104857600) { toast(`"${f.name}" passa de 100 MB.`); continue; }
    const path = `${alunaId || "todas"}/${sec}/${Date.now()}-${slug(f.name)}`;
    const { error } = await sb.storage.from("mentoria").upload(path, f, { contentType: f.type || "application/octet-stream", upsert: false });
    if (error) { toast(`Não consegui enviar "${f.name}".`); continue; }
    const { error: e2 } = await sb.from("ms_materiais").insert({ aluna_id: alunaId, secao: sec, titulo: f.name.replace(/\.[^.]+$/, ""), caminho: path, tipo: f.type, tamanho: f.size });
    if (e2) { await sb.storage.from("mentoria").remove([path]); toast("Erro ao salvar o material."); continue; }
    ok++;
  }
  bar.style.width = "100%";
  if (ok) toast(ok === 1 ? "Material enviado." : `${ok} materiais enviados.`);
  recarregar();
}

  const mesAtual = new Date().toISOString().slice(0, 7);
  if (!A.mesF) A.mesF = "todos";
  const lista = A.pags.filter(p => A.mesF === "todos" || p.pago_em.slice(0, 7) === A.mesF);
  const doMes = ok.filter(p => p.pago_em.slice(0, 7) === mesAtual).reduce((s, p) => s + +p.valor, 0);
  const proxR = METAS_R.find(m => total < m), maxR = METAS_R[METAS_R.length - 1];
  const nomeMes = m => { const [y, mo] = m.split("-"); return new Date(+y, mo - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" }).replace(/^./, c => c.toUpperCase()); };
  $("#main").innerHTML = `
    <h2 class="t">Financeiro e metas</h2><p class="s">Os pagamentos feitos pelo site entram aqui sozinhos e você recebe um e-mail a cada venda. Vendas por fora você registra no botão abaixo. <button class="lnk" id="testeMail">Testar o alerta por e-mail</button></p>
    <div class="metas">
      <div class="card meta">
        <div class="meta-h"><div><span class="mh">Meta de faturamento</span><b class="big">${brl(total)}</b><small>${proxR ? `Faltam ${brl(proxR - total)} para ${brlK(proxR)}` : "Todas as metas batidas! ✨"}</small></div>${proxR ? `<span class="pct">${Math.floor(total / proxR * 100)}%</span>` : `<span class="pct ok">${svg(I.check)}</span>`}</div>
        <div class="trk"><i style="width:${Math.min(100, total / maxR * 100)}%"></i>${METAS_R.map(m => `<span class="ms ${total >= m ? "ok" : ""}" style="left:${m / maxR * 100}%"><em>${total >= m ? svg(I.check) : ""}</em><small>${brlK(m)}</small></span>`).join("")}</div>
      </div>
      <div class="card meta">
        <div class="meta-h"><div><span class="mh">Meta de alunas</span><b class="big">${alunasN} <span style="font-size:15px;color:var(--soft);font-weight:400">de ${META_A}</span></b><small>${alunasN >= META_A ? "Meta de 50 alunas batida! ✨" : `Faltam ${META_A - alunasN} alunas`}</small></div><span class="pct ${alunasN >= META_A ? "ok" : ""}">${alunasN >= META_A ? svg(I.check) : Math.floor(alunasN / META_A * 100) + "%"}</span></div>
        <div class="dots">${Array.from({ length: META_A }, (_, i) => `<i class="${i < alunasN ? "on" : ""} ${(i + 1) % 10 === 0 ? "dez" : ""}" title="Aluna ${i + 1}">${(i + 1) % 10 === 0 ? i + 1 : ""}</i>`).join("")}</div>
      </div>
    </div>
    <div class="kpis"><div class="kpi"><b>${brl(doMes)}</b><span>faturado em ${nomeMes(mesAtual).split(" ")[0].toLowerCase()}</span></div><div class="kpi"><b>${ok.length}</b><span>vendas aprovadas</span></div><div class="kpi"><b>${brl(ok.length ? total / ok.length : 0)}</b><span>ticket médio</span></div><div class="kpi"><b>${ok.filter(p => p.forma === "pix").length} · ${ok.filter(p => p.forma === "cartao").length}</b><span>Pix · cartão</span></div></div>
    <div class="card">
      <div class="rel-h"><h3 style="font-weight:500;font-size:17px">Relatório de pagamentos</h3>
        <div class="rel-f"><select id="mesF"><option value="todos">Todos os meses</option>${meses.map(m => `<option value="${m}" ${A.mesF === m ? "selected" : ""}>${nomeMes(m)}</option>`).join("")}</select>
        <button class="btn btn-line btn-sm" id="csv">${svg(I.dl)}Planilha</button><button class="btn btn-sm" id="novoPag">${svg(I.plus)}Registrar pagamento</button></div></div>
      <div class="tbl"><table><thead><tr><th>Data</th><th>Aluna</th><th>Forma</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>
      ${lista.map(p => `<tr class="${p.status !== "aprovado" ? "off" : ""}"><td>${new Date(p.pago_em).toLocaleDateString("pt-BR")}</td><td><b>${esc(p.nome || "-")}</b><small>${esc(p.email || "")}${p.origem === "site" ? " · site" : " · manual"}</small></td><td>${formaTxt(p)}</td><td class="v">${brl(p.valor)}${p.valor_liquido != null ? `<small>líquido ${brl(p.valor_liquido)}</small>` : ""}</td><td><span class="st ${p.status === "aprovado" ? "" : "pausada"}">${p.status}</span></td><td>${p.origem === "manual" ? `<button class="lnk" data-rmp="${p.id}">excluir</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="6"><p class="empty">Nenhum pagamento ${A.mesF === "todos" ? "ainda" : "neste mês"}.</p></td></tr>`}
      </tbody>${lista.length ? `<tfoot><tr><td colspan="3">Total aprovado</td><td class="v">${brl(lista.filter(p => p.status === "aprovado").reduce((s, p) => s + +p.valor, 0))}</td><td colspan="2"></td></tr></tfoot>` : ""}</table></div>
    </div>`;
  $("#mesF").onchange = e => { A.mesF = e.target.value; renderFinanceiro(); };
  $("#novoPag").onclick = dlgPagamento;
  $("#testeMail").onclick = async e => { e.target.disabled = true; const r = await adminFn({ acao: "testar_alerta" }); e.target.disabled = false; toast(r.error || "Enviado! Veja seu e-mail (na primeira vez, clique em Activate)."); };
  $("#csv").onclick = () => {
    const rows = [["Data", "Aluna", "E-mail", "Forma", "Parcelas", "Valor", "Líquido", "Situação", "Origem"], ...lista.map(p => [new Date(p.pago_em).toLocaleDateString("pt-BR"), p.nome, p.email, formaTxt(p), p.parcelas, String(p.valor).replace(".", ","), p.valor_liquido != null ? String(p.valor_liquido).replace(".", ",") : "", p.status, p.origem])];
    const csv = "\ufeff" + rows.map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `mentoria-pagamentos-${A.mesF}.csv`; a.click();
  };
  $$("[data-rmp]").forEach(b => b.onclick = async () => { if (!confirm("Excluir este pagamento registrado à mão?")) return; const { error } = await sb.from("ms_pagamentos").delete().eq("id", b.dataset.rmp); if (error) return toast("Não consegui excluir."); abrirFinanceiro(); });
}
function dlgPagamento() {
  const hoje = new Date().toISOString().slice(0, 10);
  abrirDlg(`<form id="f-pag" class="dlg" style="padding:0"><h3>Registrar pagamento</h3><p style="font-size:13.5px;color:var(--muted)">Para vendas fora do site (Pix direto, link do Mercado Pago, etc.).</p>
    <label class="fl">Aluna<select name="aluna"><option value="">Escolha…</option>${A.alunas.filter(a => !a.teste).map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join("")}<option value="_">Outra pessoa (sem cadastro)</option></select></label>
    <label class="fl" id="pag-nome" hidden>Nome<input name="nome"></label>
    <div class="g2"><label class="fl">Valor (R$)<input name="valor" inputmode="decimal" placeholder="1.700,00" required></label><label class="fl">Data<input name="data" type="date" value="${hoje}" required></label></div>
    <div class="g2"><label class="fl">Forma<select name="forma"><option value="pix">Pix</option><option value="cartao">Cartão</option><option value="transferencia">Transferência</option><option value="boleto">Boleto</option><option value="outro">Outro</option></select></label><label class="fl">Parcelas<input name="parcelas" type="number" min="1" max="24" value="1"></label></div>
    <p class="err" hidden></p>
    <div class="acts"><button type="button" class="btn btn-line btn-sm" data-fechar>Cancelar</button><button class="btn btn-sm">Registrar</button></div></form>`);
  const f = $("#f-pag");
  f.aluna.onchange = () => $("#pag-nome").hidden = f.aluna.value !== "_";
  f.onsubmit = async e => {
    e.preventDefault(); const err = $(".err", f);
    const valor = parseFloat(f.valor.value.replace(/[^\d,.-]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", "."));
    const al = A.alunas.find(a => a.id === f.aluna.value);
    if (!(valor > 0)) { err.textContent = "Informe o valor."; err.hidden = false; return; }
    if (!al && !f.nome.value.trim()) { err.textContent = "Escolha a aluna ou escreva o nome."; err.hidden = false; return; }
    const { error } = await sb.from("ms_pagamentos").insert({ aluna_id: al?.id || null, nome: al?.nome || f.nome.value.trim(), email: al?.email || null, valor, forma: f.forma.value, parcelas: +f.parcelas.value || 1, pago_em: new Date(f.data.value + "T12:00:00").toISOString(), origem: "manual" });
    if (error) { err.textContent = "Não consegui registrar."; err.hidden = false; return; }
    $("#dlg").close(); toast("Pagamento registrado."); abrirFinanceiro();
  };
}

function dlgCriarLogin(a) {
  abrirDlg(`<form id="f-cl" class="dlg" style="padding:0"><h3>Criar login de ${esc(firstName(a.nome))}</h3>
    <p style="font-size:13.5px;color:var(--muted)">O login é o e-mail que ela usou: <b style="color:var(--ink)">${esc(a.email)}</b></p>
    <div class="g2"><label class="fl">WhatsApp<input name="whatsapp" value="${esc(a.whatsapp)}" placeholder="(71) 99999-9999"></label><label class="fl">Instagram<input name="instagram" value="${esc(a.instagram)}" placeholder="@perfil"></label></div>
    <label class="fl">Senha<span class="pwrow"><input name="senha" value="${gerarSenha()}" required><button type="button" class="btn btn-line btn-sm" id="g3">Gerar</button></span></label>
    <p class="err" hidden></p>
    <div class="acts"><button type="button" class="btn btn-line btn-sm" data-fechar>Cancelar</button><button class="btn btn-sm">Criar login</button></div></form>`);
  const f = $("#f-cl"); $("#g3").onclick = () => f.senha.value = gerarSenha();
  f.onsubmit = async e => {
    e.preventDefault(); const err = $(".err", f), b = $("button:not([type])", f); b.disabled = true;
    if (f.whatsapp.value.trim() !== (a.whatsapp || "") || f.instagram.value.trim() !== (a.instagram || "")) await sb.from("ms_alunas").update({ whatsapp: f.whatsapp.value.trim() || null, instagram: f.instagram.value.trim() || null }).eq("id", a.id);
    const r = await adminFn({ acao: "criar_login", aluna_id: a.id, senha: f.senha.value.trim() }); b.disabled = false;
    if (r.error) { err.textContent = r.error; err.hidden = false; return; }
    Object.assign(a, r.aluna); await carregarLista(); A.aluna = A.alunas.find(x => x.id === a.id) || a; renderAluna(); dlgAcesso(A.aluna, f.senha.value.trim());
  };
}

/* ---------- diálogos ---------- */
function gerarSenha() { const L = "abcdefghjkmnpqrstuvwxyz", N = "23456789", r = a => a[crypto.getRandomValues(new Uint32Array(1))[0] % a.length]; return "Sublime" + r(N) + r(N) + r(L) + r(L) + r(N); }
function abrirDlg(html) { $("#dlg-in").innerHTML = html; $("#dlg").showModal(); $$("#dlg [data-fechar]").forEach(b => b.onclick = () => $("#dlg").close()); }

async function adminFn(body) {
  const { data: { session } } = await sb.auth.getSession();
  try {
    const r = await fetch(`${SB_URL}/functions/v1/ms-admin`, { method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({})); return r.ok ? j : { error: j.error || "Algo deu errado. Tente de novo." };
  } catch { return { error: "Sem conexão. Tente de novo." }; }
}

function dlgNova(pre) {
  abrirDlg(`<form id="f-nova" class="dlg" style="padding:0;gap:14px"><h3>Nova aluna</h3>
    <label class="fl">Nome completo<input name="nome" required value="${esc(pre?.nome)}"></label>
    <label class="fl">E-mail (é o login dela)<input name="email" type="email" required value="${esc(pre?.email)}"></label>
    <div class="g2"><label class="fl">WhatsApp<input name="whatsapp" value="${esc(pre?.whatsapp)}" placeholder="(71) 99999-9999"></label><label class="fl">Instagram<input name="instagram" value="${esc(pre?.instagram)}" placeholder="@perfil"></label></div>
    <label class="fl">Senha <small>você cria e manda para ela</small><span class="pwrow"><input name="senha" required value="${gerarSenha()}"><button type="button" class="btn btn-line btn-sm" id="g2">Gerar</button></span></label>
    <p class="err" hidden></p>
    <div class="acts"><button type="button" class="btn btn-line btn-sm" data-fechar>Cancelar</button><button class="btn btn-sm">Criar acesso</button></div></form>`);
  const f = $("#f-nova"); $("#g2").onclick = () => f.senha.value = gerarSenha();
  f.onsubmit = async e => {
    e.preventDefault(); const err = $(".err", f), b = $("button:not([type])", f);
    const body = { acao: "criar_aluna", nome: f.nome.value.trim(), email: f.email.value.trim(), whatsapp: f.whatsapp.value.trim(), instagram: f.instagram.value.trim(), senha: f.senha.value.trim() };
    if (!body.nome || !body.email) { err.textContent = "Preencha nome e e-mail."; err.hidden = false; return; }
    b.disabled = true; b.textContent = "Criando…";
    const r = await adminFn(body); b.disabled = false; b.textContent = "Criar acesso";
    if (r.error) { err.textContent = r.error; err.hidden = false; return; }
    await carregarLista(); await abrirAluna(r.aluna.id, "encontros"); dlgAcesso(r.aluna, body.senha);
  };
}

function dlgAcesso(a, senha) {
  const txt = `Oi, ${firstName(a.nome)}! ✨\n\nSua área da Mentoria Sublime já está pronta. Lá você encontra as datas dos nossos encontros, os materiais, os slides e um espaço para me deixar recados.\n\nAcesse: ${AREA_URL}\nE-mail: ${a.email}\nSenha: ${senha || "(a senha que te enviei)"}\n\nQualquer dificuldade para entrar, me chama aqui.`;
  const tel = (a.whatsapp || "").replace(/\D/g, "").replace(/^55/, "");
  abrirDlg(`<h3>${senha ? "Acesso pronto ✓" : "Mensagem de acesso"}</h3><p style="font-size:13.5px;color:var(--muted)">${senha ? "Copie e mande para ela. Por segurança, a senha não fica guardada no painel." : "Para incluir a senha, troque a senha em Dados e acesso."}</p>
    <div class="acesso" id="txt">${esc(txt)}</div>
    <div class="acts"><button class="btn btn-line btn-sm" data-fechar>Fechar</button><button class="btn btn-line btn-sm" id="cp">Copiar</button>${tel.length >= 10 ? `<a class="btn btn-sm" target="_blank" rel="noopener" href="https://wa.me/55${tel}?text=${encodeURIComponent(txt)}">Enviar no WhatsApp</a>` : ""}</div>`);
  $("#cp").onclick = async e => { try { await navigator.clipboard.writeText(txt); e.target.textContent = "Copiado ✓"; } catch { e.target.textContent = "Não copiou"; } };
}

function dlgLink(sec, alunaId, recarregar) {
  abrirDlg(`<form id="f-link" class="dlg" style="padding:0"><h3>Adicionar link</h3><p style="font-size:13.5px;color:var(--muted)">Canva, Google Drive, YouTube, gravação do encontro…</p>
    <label class="fl">Nome<input name="titulo" required placeholder="Ex.: Slides do encontro 1"></label>
    <label class="fl">Link<input name="url" type="url" required placeholder="https://"></label>
    <div class="acts"><button type="button" class="btn btn-line btn-sm" data-fechar>Cancelar</button><button class="btn btn-sm">Adicionar</button></div></form>`);
  $("#f-link").onsubmit = async e => {
    e.preventDefault(); const f = e.target; let url = f.url.value.trim(); if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    const { error } = await sb.from("ms_materiais").insert({ aluna_id: alunaId, secao: sec, titulo: f.titulo.value.trim(), url });
    if (error) return toast("Não consegui salvar o link.");
    $("#dlg").close(); toast("Link adicionado."); recarregar();
  };
}

iniciar();
</script>
</body></html>
