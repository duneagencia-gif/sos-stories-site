<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Área do cliente · Diana Freitas</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2B0A11">
<link rel="icon" href="/mentoria/favicon.png?v=2">
<link rel="apple-touch-icon" href="/mentoria/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/mentoria/area/area.css">
<style>
.top .sig{width:150px}
.lg-sig{width:200px;margin:0 auto 26px}
/* topo */
.hero{padding-bottom:84px}
.hero-in{width:min(1080px,100% - 40px);margin:0 auto;padding:clamp(40px,7vw,76px) 0 0;display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,64px);align-items:center}
.hero h1{font-weight:300;font-size:clamp(32px,5.2vw,54px);line-height:1.08;letter-spacing:-.025em;margin-top:14px}
.hero h1 .nm{display:block;font-weight:500;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.hero .lead{color:#DCC6B6;margin-top:20px;max-width:46ch;font-size:clamp(15px,1.55vw,16.5px);text-wrap:balance}
.hero .msg{margin-top:20px;max-width:46ch;padding:16px 18px 16px 20px;border-left:2px solid var(--goldl);color:#F2E4D6;font-size:14.5px;background:rgba(255,255,255,.035);border-radius:0 14px 14px 0}
.hero .msg small{display:block;color:var(--goldl);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;margin-bottom:4px}
.prox{position:relative;border:1px solid var(--lined);border-radius:28px;padding:28px 26px 26px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015))}
.prox .eyebrow{color:var(--goldl);font-size:10.5px}
.prox h2{font-weight:400;font-size:22px;line-height:1.25;margin-top:10px;letter-spacing:-.01em;text-wrap:balance}
.ring{display:flex;align-items:center;gap:18px;margin-top:20px}
.ring svg{width:76px;height:76px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(226,192,142,.16)}
.ring .fg{stroke:url(#gg);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring p{font-size:14px;color:#E9D9CB;line-height:1.5}
.ring p b{display:block;color:#fff;font-size:17px;font-weight:500}
.prox .nx{margin-top:20px;padding-top:18px;border-top:1px solid var(--lined);font-size:14px;color:#DCC6B6}
.prox .nx b{display:block;color:#fff;font-weight:500;font-size:15.5px}
.prox .nx .st{display:inline-block;margin-top:8px}
.trilha{display:flex;gap:6px;margin-top:18px}
.trilha i{flex:1;height:3px;border-radius:3px;background:rgba(226,192,142,.18)}
.trilha i.ok{background:var(--goldl)}
.trilha i.on{background:linear-gradient(90deg,var(--goldl) 50%,rgba(226,192,142,.18) 50%)}

main{width:min(1080px,100% - 40px);margin:0 auto;padding:clamp(56px,8vw,88px) 0 90px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
.sec-h h2{font-weight:400;font-size:clamp(25px,3.4vw,34px);letter-spacing:-.02em;line-height:1.15;margin-top:8px}
.sec-h p{color:var(--muted);font-size:14.5px;max-width:40ch}
section+section{margin-top:clamp(64px,9vw,100px)}

/* status */
.st{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;border-radius:999px;padding:6px 12px;white-space:nowrap;letter-spacing:.01em}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.a_fazer{color:var(--soft);box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.st.andamento{color:#8A5A1E;background:#F7EBD8}
.st.aprovacao{color:#fff;background:var(--wine3)}
.st.concluido{color:#2F5B3A;background:#E3EFE3}
.prox .st.a_fazer{color:#CDB6A8;box-shadow:inset 0 0 0 1px var(--lined)}

/* entregas */
.mods{display:grid;gap:16px}
.mod{background:var(--paper);border:1px solid var(--line);border-radius:26px;overflow:hidden;transition:box-shadow .3s,border-color .3s}
.mod.open{box-shadow:0 24px 50px rgba(43,10,17,.08);border-color:rgba(184,137,79,.35)}
.mod.aprov{border-color:rgba(106,29,46,.35)}
.mod-h{width:100%;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:clamp(14px,2.4vw,26px);padding:clamp(18px,2.6vw,26px) clamp(18px,3vw,30px);background:none;border:0;cursor:pointer;text-align:left}
.num{width:52px;height:52px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:15px;font-weight:500;color:var(--wine3);position:relative}
.mod.done .num{background:var(--wine3);border-color:var(--wine3);color:var(--goldl)}
.mod.done .num::after{content:"";position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--goldg) center/11px no-repeat url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232B0A11' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7.5'/></svg>")}
.mod-t small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:500}
.mod-t h3{font-weight:500;font-size:clamp(17px,2vw,20px);letter-spacing:-.01em;line-height:1.3;margin-top:2px}
.mod-t p{font-size:14px;color:var(--muted);line-height:1.5;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mod.open .mod-t p{-webkit-line-clamp:unset}
.chev{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);transition:transform .3s}
.chev svg{width:16px;height:16px}
.mod.open .chev{transform:rotate(180deg)}
.mod-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.mod.open .mod-b{grid-template-rows:1fr}
.mod-b>div{overflow:hidden}
.mod-in{padding:clamp(20px,3vw,28px) clamp(18px,3vw,30px) clamp(22px,3vw,30px);display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(20px,3vw,40px);border-top:1px solid var(--line)}
.info{display:grid;gap:16px;align-content:start}
.info .row{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.5}
.info .row svg{width:20px;height:20px;flex:none;color:var(--gold);margin-top:1px}
.info .row b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:500}
.get{background:linear-gradient(120deg,#F6EDE2,#FBF5EE);border-radius:18px;padding:14px 16px;font-size:14px;display:flex;gap:12px;align-items:center}
.get svg{width:22px;height:22px;color:var(--goldd);flex:none}
.get b{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--goldd)}
.orient{font-size:14.5px;color:var(--ink)}
.orient b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.aprova{background:var(--wine3);color:#F7EEE4;border-radius:18px;padding:16px 18px;font-size:14px;line-height:1.5}
.aprova b{display:block;color:var(--goldl);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px}
.aprova .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.info .acts{display:flex;flex-wrap:wrap;gap:10px}
.lado{display:grid;gap:22px;align-content:start}
.mats h4,.ad h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:500;margin-bottom:12px}
.mat-list{display:grid;gap:10px}
.mat{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:18px;background:var(--ivory);border:1px solid var(--line);transition:border-color .2s,background .2s}
.mat:hover{border-color:rgba(184,137,79,.45);background:#fff}
.mat .ic{width:44px;height:44px;border-radius:14px;background:var(--paper);display:grid;place-items:center;color:var(--wine3);box-shadow:inset 0 0 0 1px var(--line)}
.mat .ic svg{width:21px;height:21px}
.mat .tt{min-width:0}
.mat .tt b{display:block;font-size:14.5px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.mat .tt small{font-size:12px;color:var(--soft)}
.mat .bt{display:flex;gap:6px}
.icb{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:var(--wine3);color:#FFF6EC;transition:background .2s,transform .2s;flex:none}
.icb:hover{background:var(--wine2);transform:translateY(-1px)}
.icb.l{background:transparent;color:var(--wine3);box-shadow:inset 0 0 0 1px rgba(106,29,46,.25)}
.icb svg{width:17px;height:17px}
.empty{font-size:14px;color:var(--soft);padding:18px;border:1px dashed rgba(43,10,17,.15);border-radius:18px;text-align:center;line-height:1.5}

/* antes e depois */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{position:relative;border-radius:18px;overflow:hidden;background:var(--sand);aspect-ratio:4/5;cursor:zoom-in;border:0;padding:0}
.cmp img{width:100%;height:100%;object-fit:cover;object-position:top}
.cmp figcaption{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(255,253,249,.92);color:var(--wine)}
.cmp figure.dep figcaption{background:var(--goldg)}
.cmp .vz{display:grid;place-items:center;text-align:center;font-size:13px;color:var(--soft);padding:16px;cursor:default;border:1px dashed rgba(43,10,17,.15);background:transparent}
.cmp figure .mais{position:absolute;right:10px;bottom:10px;font-size:11px;color:#fff;background:rgba(43,10,17,.7);border-radius:999px;padding:3px 9px}
.galeria{display:grid;gap:clamp(26px,4vw,40px)}
.gal-it{display:grid;grid-template-columns:.7fr 1.3fr;gap:clamp(18px,3vw,36px);align-items:center}
.gal-it h3{font-weight:500;font-size:20px;line-height:1.3;margin-top:6px;text-wrap:balance}
.gal-it p{font-size:14px;color:var(--muted);margin-top:6px}
.gal-it .cmp figure{border-radius:22px}
.wine.ad-sec{border-radius:30px;padding:clamp(28px,4vw,46px);overflow:hidden}
.ad-sec .sec-h p{color:#DCC6B6}
.ad-sec .gal-it p{color:#CDB6A8}
.ad-sec .eyebrow{color:var(--goldl)}

/* acessos */
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ac{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;display:grid;gap:10px;align-content:start}
.ac-h{display:flex;align-items:center;gap:12px}
.ac-h .ic{width:42px;height:42px;border-radius:14px;background:var(--sand);display:grid;place-items:center;color:var(--wine3);flex:none}
.ac-h .ic svg{width:20px;height:20px}
.ac-h b{font-weight:500;font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.ac-h .lnk{font-size:12px}
.ac .cp{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--ivory);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px}
.ac .cp small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:500}
.ac .cp span{overflow-wrap:anywhere}
.ac .cp .bts{display:flex;gap:4px}
.ac .cp .icb{width:34px;height:34px}
.ac .cp .icb svg{width:15px;height:15px}
.ac .obs{font-size:13px;color:var(--muted)}
.ac-add{border:1px dashed rgba(184,137,79,.5);background:transparent;border-radius:22px;min-height:150px;display:grid;place-items:center;gap:6px;cursor:pointer;color:var(--wine3);font-size:14px;font-weight:500;align-content:center}
.ac-add svg{width:26px;height:26px;margin:0 auto}
.seg{font-size:13px;color:var(--soft);margin-top:14px;display:flex;gap:8px;align-items:center}
.seg svg{width:16px;height:16px;color:var(--gold)}

/* investimento */
.inv{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px}
.inv-v{border-radius:26px;padding:clamp(24px,3vw,32px);display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.inv-v .eyebrow{color:var(--goldl)}
.inv-v .amount{font-weight:300;font-size:clamp(44px,6vw,60px);line-height:1;letter-spacing:-.03em;margin-top:10px}
.inv-v .amount small{font-size:.32em;color:var(--goldl);vertical-align:1.1em;margin-right:4px;font-weight:400}
.inv-v p{color:#DCC6B6;font-size:14px}
.pix{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid var(--lined);border-radius:16px;padding:10px 10px 10px 16px;font-size:13.5px}
.pix span{flex:1}
.pix small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--goldl);font-weight:500}
.parc{display:grid;gap:12px}
.pc{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.pc .pct{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--wine3);background:var(--sand)}
.pc.pago .pct{background:var(--wine3);color:var(--goldl)}
.pc b{display:block;font-weight:500;font-size:16px}
.pc span{font-size:13.5px;color:var(--muted)}
.pc .vl{text-align:right;font-weight:500;font-size:17px}
.pc .vl small{display:block;font-size:12px;font-weight:400;color:var(--soft)}
.pc.pago .vl small{color:#2F5B3A}

/* recados */
.notes{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(20px,4vw,48px);align-items:start}
.note-form{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:clamp(20px,3vw,28px);display:grid;gap:14px}
.note-form textarea{min-height:150px;background:repeating-linear-gradient(transparent 0 31px,rgba(184,137,79,.16) 31px 32px) var(--ivory);line-height:32px;padding-top:6px}
.note-form .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--soft)}
.feed{display:grid;gap:12px}
.n{max-width:92%;padding:14px 18px;border-radius:20px;font-size:14.5px;line-height:1.55;position:relative}
.n small{display:block;font-size:11.5px;color:var(--soft);margin-top:6px}
.n.aluna{justify-self:end;background:var(--paper);border:1px solid var(--line);border-bottom-right-radius:6px}
.n.diana{justify-self:start;background:var(--wine3);color:#F7EEE4;border-bottom-left-radius:6px}
.n.diana small{color:#D9BFAF}
.n.diana .who{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--goldl);font-weight:500;display:block;margin-bottom:2px}
.n .del{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--soft);cursor:pointer;font-size:12px;opacity:0;transition:opacity .2s}
.n:hover .del,.n:focus-within .del{opacity:1}

/* janelas */
dialog{border:0;border-radius:26px;padding:0;width:min(460px,calc(100% - 32px));background:var(--paper);color:var(--ink);box-shadow:0 40px 90px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(31,7,12,.6);backdrop-filter:blur(5px)}
.dlg-in{padding:26px 24px 22px;display:grid;gap:14px}
.dlg-in h3{font-weight:500;font-size:20px}
.dlg-in .bts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
#zoom{width:min(900px,calc(100% - 24px));background:transparent;box-shadow:none}
#zoom img{width:100%;max-height:86svh;object-fit:contain;border-radius:18px}
#zoom button{position:absolute;top:10px;right:10px}

.banner{background:#FFF4D8;color:#5B4310;font-size:13.5px;text-align:center;padding:10px 16px}
.banner a{font-weight:500}
.state{min-height:70svh;display:grid;place-items:center;text-align:center;padding:40px 20px}
.state h1{font-weight:400;font-size:28px;margin:16px 0 8px}
.state p{color:#DCC6B6;max-width:40ch;margin:0 auto 22px}

@media (max-width:860px){
  .hero-in,.mod-in,.notes,.inv,.gal-it{grid-template-columns:1fr}
  .mod-h{grid-template-columns:auto 1fr auto}
  .mod-h .st{grid-column:2;justify-self:start;margin-top:-6px}
  .mod-h .chev{grid-row:1;grid-column:3}
  .sec-h{flex-direction:column;align-items:flex-start}
}
@media (max-width:520px){
  .num{width:44px;height:44px;font-size:14px}
  .top .sig{width:120px}
  .top-r .t{display:none}
  .pc{grid-template-columns:auto 1fr;padding:16px}
  .pc .vl{grid-column:2;text-align:left}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#B07D45"/><stop offset=".5" stop-color="#F3DAAE"/><stop offset="1" stop-color="#C59358"/></linearGradient></defs></svg>
<div id="banner" class="banner" hidden></div>
<div id="carregando" class="wine loading"><i></i></div>
<div id="login" class="wine" data-base="/mentoria/" hidden></div>
<div id="estado" class="wine" hidden></div>
<div id="app" hidden></div>
<dialog id="dlg"><div class="dlg-in" id="dlg-in"></div></dialog>
<dialog id="zoom"><img alt=""><button class="icb" data-fechar aria-label="Fechar">✕</button></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/mentoria/area/comum.js"></script>
<script>
const ICO = {
  cal: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  down: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  lock: '<rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  logout: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  wa: '<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-1 .8c-1-.4-1.8-1.2-2.2-2.2l.8-1-1-2z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>'
};
const PIX = "51983844000130";
const money = v => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
let S = { c: null, ent: [], mats: [], notas: [], acessos: [], urls: {}, admin: false, user: null };

function mostrar(id) { ["carregando", "login", "estado", "app"].forEach(x => $("#" + x).hidden = x !== id); }

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    montarLogin({ titulo: 'Seu projeto com<br><em>Diana Freitas.</em>', sub: "Área do cliente", aoEntrar: iniciar, ajuda: "Oi, Diana! Esqueci a senha da minha área do cliente." });
    $("#login .lg-seal").outerHTML = '<img class="lg-sig" src="/mentoria/assinatura-dourada.png" alt="Diana Freitas" width="1400" height="365">';
    mostrar("login"); return;
  }
  S.user = session.user;
  S.admin = await souAdmin();
  const ver = new URLSearchParams(location.search).get("c");
  let q = sb.from("ms_alunas").select("*");
  q = S.admin && ver ? q.eq("id", ver) : q.eq("user_id", session.user.id);
  const { data: c } = await q.maybeSingle();
  if (!c) {
    if (S.admin) { location.href = "/mentoria/area/admin/"; return; }
    $("#estado").innerHTML = `<div><img src="/mentoria/assinatura-dourada.png" alt="Diana Freitas" style="width:200px;margin:0 auto"><h1>Sua área ainda não está liberada</h1><p>A Diana libera o seu acesso em breve. Qualquer dúvida, fale com ela.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><a class="btn btn-gold" href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">Falar com a Diana</a><button class="btn btn-ghost" onclick="sair()">Sair</button></div></div>`;
    mostrar("estado"); return;
  }
  if (c.tipo !== "projeto" && !S.admin) { location.href = "/mentoria/area/"; return; }
  S.c = c;
  await carregar();
  if (S.admin) { const b = $("#banner"); b.innerHTML = `Você está vendo a área de <b>${esc(c.nome)}</b> como ela vê. <a href="/mentoria/area/admin/?aluna=${c.id}">Voltar ao painel</a>`; b.hidden = false; }
  render(); mostrar("app");
}

async function carregar() {
  const id = S.c.id;
  const [m, mt, n, ac] = await Promise.all([
    sb.from("ms_modulos").select("*").eq("aluna_id", id).order("ordem"),
    sb.from("ms_materiais").select("*").eq("aluna_id", id).order("criado_em"),
    sb.from("ms_notas").select("*").eq("aluna_id", id).order("criado_em"),
    sb.from("ms_acessos").select("*").eq("aluna_id", id).order("criado_em")
  ]);
  S.ent = (m.data || []).filter(x => x.tipo === "entrega");
  S.mats = mt.data || []; S.notas = n.data || []; S.acessos = ac.data || [];
  const imgs = S.mats.filter(x => /[ad]$/.test(x.secao) && x.caminho);
  if (imgs.length) {
    const { data } = await sb.storage.from("mentoria").createSignedUrls(imgs.map(x => x.caminho), 3600);
    (data || []).forEach((r, i) => { if (r.signedUrl) S.urls[imgs[i].id] = r.signedUrl; });
  }
}

const pj = () => S.c.projeto || {};
const fotos = (ordem, lado) => S.mats.filter(x => x.secao === `m${ordem}${lado}` && S.urls[x.id]);

function cmpHTML(m) {
  const a = fotos(m.ordem, "a"), d = fotos(m.ordem, "d");
  if (!a.length && !d.length) return "";
  const fig = (l, cls, cap) => l.length ? `<figure class="${cls}" data-zoom="${l[0].id}"><img src="${S.urls[l[0].id]}" alt="${cap}: ${esc(m.titulo)}" loading="lazy"><figcaption>${cap}</figcaption>${l.length > 1 ? `<span class="mais">+${l.length - 1}</span>` : ""}</figure>` : `<figure class="vz">${cap === "Depois" ? "O depois aparece aqui quando estiver pronto." : "Sem foto do antes."}</figure>`;
  return `<div class="cmp">${fig(a, "ant", "Antes")}${fig(d, "dep", "Depois")}</div>`;
}

function matHTML(x) {
  const ic = tipoIcone(x), link = !x.caminho;
  const sub = link ? "Link" : [({ pdf: "PDF", slide: "Apresentação", img: "Imagem", video: "Vídeo", zip: "Pacote", file: "Arquivo" })[ic], fmtTam(x.tamanho)].filter(Boolean).join(" · ");
  return `<div class="mat"><span class="ic">${svg(ic)}</span><span class="tt"><b>${esc(x.titulo)}</b><small>${sub}</small></span><span class="bt">
    ${link ? `<button class="icb" data-ver="${x.id}" aria-label="Abrir ${esc(x.titulo)}">${svg(ICO.ext)}</button>` :
      `<button class="icb l" data-ver="${x.id}" aria-label="Ver ${esc(x.titulo)}">${svg(ICO.eye)}</button><button class="icb" data-baixar="${x.id}" aria-label="Baixar ${esc(x.titulo)}">${svg(ICO.down)}</button>`}
  </span></div>`;
}

function render() {
  const c = S.c, p = pj(), ent = S.ent;
  const feitos = ent.filter(x => x.status === "concluido").length;
  const pct = ent.length ? Math.round(feitos / ent.length * 100) : 0;
  const prox = ent.find(x => x.status === "aprovacao") || ent.find(x => x.status === "andamento") || ent.find(x => x.status !== "concluido");
  const R = 33, L = 2 * Math.PI * R;
  const comAD = ent.filter(m => fotos(m.ordem, "a").length && fotos(m.ordem, "d").length);
  const parc = Array.isArray(p.pagamento) ? p.pagamento : [];

  $("#app").innerHTML = `
  <header class="wine hero">
    <div class="top"><img class="sig" src="/mentoria/assinatura-dourada.png" alt="Diana Freitas" width="1400" height="365">
      <div class="top-r">${S.admin ? `<a href="/mentoria/area/admin/?aluna=${c.id}">${svg(ICO.gear)}<span class="t">Painel</span></a>` : ""}<button onclick="sair()">${svg(ICO.logout)}<span class="t">Sair</span></button></div></div>
    <div class="hero-in">
      <div>
        <span class="eyebrow" style="color:var(--goldl)">Área do cliente${p.empresa ? " · " + esc(p.empresa) : ""}</span>
        <h1>Olá, <span class="nm">${esc(firstName(c.nome))}.</span></h1>
        <p class="lead">${esc(p.descricao || "Este é o espaço do nosso projeto. Aqui você acompanha cada entrega, vê o antes e depois, guarda os acessos e fala comigo.")}</p>
        ${c.mensagem ? `<div class="msg"><small>Recado da Diana</small>${nl(c.mensagem)}</div>` : ""}
      </div>
      <aside class="prox">
        <span class="eyebrow">Seu projeto</span>
        <h2>${esc(p.titulo || "Projeto")}</h2>
        <div class="ring"><svg viewBox="0 0 76 76" aria-hidden="true"><circle class="bg" cx="38" cy="38" r="${R}"/><circle class="fg" cx="38" cy="38" r="${R}" stroke-dasharray="${L}" stroke-dashoffset="${L}" data-off="${L * (1 - pct / 100)}"/></svg>
          <p><b>${pct}% concluído</b>${feitos} de ${ent.length} entregas prontas</p></div>
        <div class="trilha" aria-hidden="true">${ent.map(x => `<i class="${x.status === "concluido" ? "ok" : x.status === "andamento" || x.status === "aprovacao" ? "on" : ""}"></i>`).join("")}</div>
        ${prox ? `<div class="nx">${prox.status === "aprovacao" ? "Esperando a sua aprovação" : "Agora"}<b>${esc(prox.titulo)}</b><span class="st ${prox.status}">${STATUS_ENTREGA[prox.status]}</span></div>` : ent.length ? `<div class="nx">Tudo pronto<b>Todas as entregas foram concluídas.</b></div>` : ""}
      </aside>
    </div>
  </header>
  <div class="lace" aria-hidden="true"></div>
  <main>
    <section id="entregas">
      <div class="sec-h"><div><span class="eyebrow">O que eu entrego</span><h2>As entregas do projeto</h2></div><p>Toque em cada entrega para ver os detalhes, o antes e depois e os arquivos.</p></div>
      <div class="mods">${ent.map(m => modHTML(m, prox && prox.id === m.id)).join("") || `<p class="empty">As entregas aparecem aqui em breve.</p>`}</div>
    </section>

    ${comAD.length ? `<section id="antes-depois" class="wine ad-sec">
      <div class="sec-h"><div><span class="eyebrow">Transformação</span><h2>Antes e depois</h2></div><p>Toque nas imagens para ver em tamanho maior.</p></div>
      <div class="galeria">${comAD.map(m => `<div class="gal-it"><div><span class="eyebrow">${String(m.ordem).padStart(2, "0")}</span><h3>${esc(m.titulo)}</h3></div>${cmpHTML(m)}</div>`).join("")}</div>
    </section>` : ""}

    <section id="acessos">
      <div class="sec-h"><div><span class="eyebrow">Dados de acesso</span><h2>Logins do projeto</h2></div><p>Instagram, Google, Meta e o que mais eu precisar acessar. Você pode adicionar, corrigir ou apagar quando quiser.</p></div>
      <div class="acc" id="acc">${acessosHTML()}</div>
      <p class="seg">${svg(ICO.lock)}Só você e a Diana veem estes dados.</p>
    </section>

    ${parc.length || p.valor ? `<section id="investimento">
      <div class="sec-h"><div><span class="eyebrow">Investimento</span><h2>Pagamento do projeto</h2></div>${p.proposta ? `<p><a class="lnk" href="${esc(p.proposta)}" target="_blank" rel="noopener">Rever a proposta</a></p>` : ""}</div>
      <div class="inv">
        <div class="wine inv-v"><div><span class="eyebrow">Valor do projeto</span><p class="amount"><small>R$</small>${Number(p.valor || parc.reduce((s, x) => s + Number(x.valor || 0), 0)).toLocaleString("pt-BR")}</p></div>
          <div><p style="margin-bottom:10px">Pagamento via Pix</p><div class="pix"><span><small>Chave Pix · CNPJ</small>51.983.844/0001-30</span><button class="btn btn-gold btn-sm" id="pix">${svg(ICO.copy)}Copiar</button></div></div></div>
        <div class="parc">${parc.map((x, i) => `<div class="pc ${x.pago ? "pago" : ""}"><span class="pct">${x.pct || (i + 1) + "ª"}</span><div><b>${esc(x.rotulo || `Parcela ${i + 1}`)}</b><span>${esc(x.quando || "")}</span></div><div class="vl">${money(x.valor)}<small>${x.pago ? "Pago ✓" : "Pendente"}</small></div></div>`).join("")}</div>
      </div>
    </section>` : ""}

    <section id="recados">
      <div class="sec-h"><div><span class="eyebrow">Fale comigo</span><h2>Recados para a Diana</h2></div></div>
      <div class="notes">
        <form class="note-form" id="nota"><label class="fl" for="nota-t">Deixe uma observação, um pedido ou uma dúvida<small> Eu leio tudo e respondo por aqui ou no WhatsApp.</small></label>
          <textarea id="nota-t" maxlength="5000" placeholder="Escreva aqui…"></textarea>
          <div class="foot"><span id="nota-c">0 / 5000</span><button class="btn btn-sm" type="submit">${svg(ICO.plus)}Salvar recado</button></div></form>
        <div class="feed" id="feed">${feedHTML()}</div>
      </div>
    </section>
  </main>
  <footer>Diana Freitas · Visual Estratégico · <a href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">Falar no WhatsApp</a></footer>`;
  ligar();
  requestAnimationFrame(() => requestAnimationFrame(() => { const f = $(".ring .fg"); if (f) f.style.strokeDashoffset = f.dataset.off; }));
}

function modHTML(m, aberto) {
  const sec = "m" + m.ordem, mats = S.mats.filter(x => x.secao === sec), done = m.status === "concluido";
  const itens = (m.entrega || "").split("\n").map(s => s.trim()).filter(Boolean);
  return `<article class="mod ${done ? "done" : ""} ${m.status === "aprovacao" ? "aprov" : ""} ${aberto ? "open" : ""}" data-mod="${m.id}">
    <button class="mod-h" aria-expanded="${aberto}"><span class="num">${String(m.ordem).padStart(2, "0")}</span>
      <span class="mod-t"><small>Entrega ${m.ordem}</small><h3>${esc(m.titulo)}</h3>${m.descricao ? `<p>${esc(m.descricao)}</p>` : ""}</span>
      <span class="st ${m.status}">${STATUS_ENTREGA[m.status]}</span><span class="chev">${svg(ICO.chev)}</span></button>
    <div class="mod-b"><div><div class="mod-in">
      <div class="info">
        ${m.status === "aprovacao" ? `<div class="aprova"><b>Para sua aprovação</b>Esta entrega está pronta para você ver. Me diga se aprova ou o que quer ajustar.<div class="acts"><a class="btn btn-gold btn-sm" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`Oi, Diana! Aprovo a entrega "${m.titulo}".`)}" target="_blank" rel="noopener">Aprovar</a><a class="btn btn-ghost btn-sm" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`Oi, Diana! Sobre a entrega "${m.titulo}", quero ajustar: `)}" target="_blank" rel="noopener">Pedir ajuste</a></div></div>` : ""}
        ${m.data ? `<div class="row">${svg(ICO.cal)}<div><b>${done ? "Entregue em" : "Prazo"}</b><span>${fmtData(m.data)}</span></div></div>` : ""}
        ${itens.length ? `<div class="get">${svg(ICO.star)}<div><b>O que inclui</b>${itens.map(esc).join(" · ")}</div></div>` : ""}
        ${m.orientacoes ? `<div class="orient"><b>Informações</b>${nl(m.orientacoes)}</div>` : ""}
        ${m.link ? `<div class="acts"><a class="btn btn-sm" href="${esc(m.link)}" target="_blank" rel="noopener">${svg(ICO.ext)}Ver a entrega</a></div>` : ""}
      </div>
      <div class="lado">
        ${cmpHTML(m) ? `<div class="ad"><h4>Antes e depois</h4>${cmpHTML(m)}</div>` : ""}
        <div class="mats"><h4>Arquivos</h4>${mats.length ? `<div class="mat-list">${mats.map(matHTML).join("")}</div>` : `<p class="empty">Os arquivos desta entrega aparecem aqui quando estiverem prontos.</p>`}</div>
      </div>
    </div></div></div>
  </article>`;
}

function acessosHTML() {
  const linha = (rot, val, id, campo, oculto) => val ? `<div class="cp"><span><small>${rot}</small><span data-v="${id}-${campo}">${oculto ? "••••••••" : esc(val)}</span></span><span class="bts">${oculto ? `<button class="icb l" data-mostra="${id}" aria-label="Mostrar senha">${svg(ICO.eye)}</button>` : ""}<button class="icb l" data-copia="${id}-${campo}" aria-label="Copiar ${rot.toLowerCase()}">${svg(ICO.copy)}</button></span></div>` : "";
  return S.acessos.map(a => `<article class="ac"><div class="ac-h"><span class="ic">${svg(ICO.key)}</span><b>${esc(a.servico)}</b><button class="lnk" data-edita="${a.id}">editar</button></div>
    ${linha("Usuário ou e-mail", a.usuario, a.id, "usuario")}${linha("Senha", a.senha, a.id, "senha", true)}${a.obs ? `<p class="obs">${nl(a.obs)}</p>` : ""}</article>`).join("")
    + `<button class="ac-add" id="ac-add">${svg(ICO.plus)}Adicionar um acesso</button>`;
}

function dlgAcesso(a) {
  a = a || {};
  $("#dlg-in").innerHTML = `<h3>${a.id ? "Editar acesso" : "Novo acesso"}</h3>
    <form id="fa" style="display:grid;gap:14px">
      <label class="fl">Serviço<input name="servico" required placeholder="Ex.: Instagram, Google Meu Negócio, Facebook" value="${esc(a.servico || "")}"></label>
      <label class="fl">Usuário ou e-mail<input name="usuario" autocomplete="off" value="${esc(a.usuario || "")}"></label>
      <label class="fl">Senha<input name="senha" autocomplete="off" value="${esc(a.senha || "")}"></label>
      <label class="fl">Observação<small> Ex.: código de verificação chega no meu celular</small><textarea name="obs" style="min-height:70px">${esc(a.obs || "")}</textarea></label>
      <div class="bts">${a.id ? `<button type="button" class="btn btn-line btn-sm" id="fa-del" style="margin-right:auto">Apagar</button>` : ""}<button type="button" class="btn btn-line btn-sm" data-fechar>Cancelar</button><button class="btn btn-sm">Salvar</button></div>
    </form>`;
  const d = $("#dlg"); d.showModal(); $$("#dlg [data-fechar]").forEach(b => b.onclick = () => d.close());
  const f = $("#fa");
  f.onsubmit = async e => {
    e.preventDefault();
    const v = { servico: f.servico.value.trim(), usuario: f.usuario.value.trim() || null, senha: f.senha.value || null, obs: f.obs.value.trim() || null };
    if (!v.servico) return f.servico.focus();
    const r = a.id ? await sb.from("ms_acessos").update(v).eq("id", a.id).select().single() : await sb.from("ms_acessos").insert({ ...v, aluna_id: S.c.id }).select().single();
    if (r.error) return toast("Não consegui salvar. Tente de novo.");
    if (a.id) Object.assign(a, r.data); else S.acessos.push(r.data);
    d.close(); $("#acc").innerHTML = acessosHTML(); toast("Acesso salvo.");
  };
  const del = $("#fa-del"); if (del) del.onclick = async () => {
    if (!confirm(`Apagar o acesso "${a.servico}"?`)) return;
    const { error } = await sb.from("ms_acessos").delete().eq("id", a.id);
    if (error) return toast("Não consegui apagar.");
    S.acessos = S.acessos.filter(x => x.id !== a.id); d.close(); $("#acc").innerHTML = acessosHTML();
  };
}

function feedHTML() {
  if (!S.notas.length) return `<p class="empty">Seus recados aparecem aqui. Pode usar à vontade: ideias, pedidos, fotos que quer usar, dúvidas.</p>`;
  return S.notas.map(n => `<div class="n ${n.autor}">${n.autor === "diana" ? '<span class="who">Diana</span>' : ""}${nl(n.texto)}<small>${fmtQuando(n.criado_em)}</small>${n.autor === "aluna" && !S.admin ? `<button class="del" data-del="${n.id}">apagar</button>` : ""}</div>`).join("");
}

async function copiar(txt, msg) { try { await navigator.clipboard.writeText(txt); toast(msg); } catch { prompt("Copie:", txt); } }

function ligar() {
  $$(".mod-h").forEach(b => b.onclick = () => { const m = b.closest(".mod"), on = !m.classList.contains("open"); m.classList.toggle("open", on); b.setAttribute("aria-expanded", on); });
  $("#app").addEventListener("click", e => {
    const t = e.target, g = s => t.closest(s);
    if (g("[data-ver]")) abrirMaterial(S.mats.find(x => x.id === g("[data-ver]").dataset.ver));
    else if (g("[data-baixar]")) abrirMaterial(S.mats.find(x => x.id === g("[data-baixar]").dataset.baixar), true);
    else if (g("[data-del]")) apagarNota(g("[data-del]").dataset.del);
    else if (g("[data-zoom]")) { const z = $("#zoom"); $("img", z).src = S.urls[g("[data-zoom]").dataset.zoom]; z.showModal(); }
    else if (g("#ac-add")) dlgAcesso();
    else if (g("[data-edita]")) dlgAcesso(S.acessos.find(x => x.id === g("[data-edita]").dataset.edita));
    else if (g("[data-mostra]")) { const id = g("[data-mostra]").dataset.mostra, el = $(`[data-v="${id}-senha"]`), a = S.acessos.find(x => x.id === id); el.textContent = el.textContent.startsWith("•") ? a.senha : "••••••••"; }
    else if (g("[data-copia]")) { const [id, campo] = g("[data-copia]").dataset.copia.split(/-(?=[a-z]+$)/); copiar(S.acessos.find(x => x.id === id)[campo], "Copiado."); }
    else if (g("#pix")) copiar(PIX, "Chave Pix copiada.");
  });
  const z = $("#zoom"); z.onclick = e => { if (e.target === z || e.target.closest("[data-fechar]")) z.close(); };
  const t = $("#nota-t"); t.oninput = () => $("#nota-c").textContent = `${t.value.length} / 5000`;
  $("#nota").onsubmit = async e => {
    e.preventDefault(); const texto = t.value.trim(); if (!texto) { t.focus(); return; }
    if (S.admin) { toast("No modo de visualização os recados ficam só com a cliente."); return; }
    const b = $("#nota button"); b.disabled = true;
    const { data, error } = await sb.from("ms_notas").insert({ aluna_id: S.c.id, texto }).select().single();
    b.disabled = false;
    if (error) { toast("Não consegui salvar. Tente de novo."); return; }
    S.notas.push(data); t.value = ""; t.oninput(); $("#feed").innerHTML = feedHTML(); toast("Recado salvo. A Diana já pode ver.");
  };
}

async function apagarNota(id) {
  if (!confirm("Apagar este recado?")) return;
  const { error } = await sb.from("ms_notas").delete().eq("id", id);
  if (error) { toast("Não consegui apagar."); return; }
  S.notas = S.notas.filter(n => n.id !== id); $("#feed").innerHTML = feedHTML();
}

iniciar();
</script>
</body></html>
